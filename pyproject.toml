[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-response-quality-evaluator"
version = "0.1.0"
description = "Transparent rubric scoring and reporting for human reviews of AI responses"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Bright Addey Williams"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
ai-quality-evaluator = "ai_quality_evaluator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

